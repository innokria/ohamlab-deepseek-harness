[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohamlab-harness"
version = "0.1.0b2"
description = "Installer and launcher for OhamLab Node.js Harness"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ohamlab", "harness", "nodejs"]

[project.scripts]
ohamlab-harness = "ohamlab_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
